schema: gaia.connection-adapter/v1
id: hacker-news
version: 2.0.1
protocol: browser
runtime: browser
auth:
  type: none
browser:
  engine: playwright
  name: Hacker News
  requires_auth: false
  login_url: https://news.ycombinator.com/
  probe_url: https://news.ycombinator.com/
  ready_selector: tr.athing .titleline a
  allowed_domains: [news.ycombinator.com]
network:
  allowed_hosts: [news.ycombinator.com]
description: 使用声明式浏览器读取 Hacker News 热门、最新消息、帖子详情与页面已加载讨论，无需登录。
